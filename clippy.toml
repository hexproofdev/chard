# SPDX-License-Identifier: BSD-3-Clause
# house lint standard 1.0.0-draft: tiers all std kani arith. Generated by assemble.sh; edit .lints/, not this file.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-dbg-in-tests = true
allow-print-in-tests = true
arithmetic-side-effects-allowed = ["core::num::Wrapping", "core::num::Saturating"]
doc-valid-idents = ["OpenSSF", "OpenBSD", "AlmaLinux", "x86_64", "AmpereOne", ".."]
disallowed-methods = [
    { path = "std::thread::sleep", reason = "a timed wait flakes in tests and blocks an executor; wait on the condition, use the runtime's sleep, or #[expect] with a reason" },
]

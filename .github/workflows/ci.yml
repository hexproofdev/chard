# SPDX-License-Identifier: BSD-3-Clause
#
# Each job runs a Makefile target, so the string a contributor types, the string in the
# README and the string here are one string; a workflow that inlines `cargo test` is a second
# gate that drifts from the first. The kani job is the exception: it runs
# `scripts/kani-gate.sh`, the one line of `make kani`'s recipe, so that no edit of the
# Makefile reaches that run.
#
# These jobs run only where the repository is pushed to GitHub, and no job here runs
# clippy-canary. `audit.yml` runs on a schedule.

---
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The runner OS is pinned, not `ubuntu-latest`: chard's tests compile probes with the
# runner's cc and assert on what that compiler's version does, so a moving
# label could turn the gate red on a day nobody touched the repository.

# One run per ref: an earlier run's verdict answers a commit nobody is looking at any more,
# and on `main` two runs can finish out of order and leave the older one as the status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: gate (lints, fmt, clippy, doc, md, sh and yaml lint, test, deny, spdx)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Pinned to a commit, with the tag in the comment. `@v4` is a moving label the action's
      # owner can repoint; `tj-actions/changed-files` (CVE-2025-30066) was compromised by
      # rewriting exactly such a tag across every version, and every workflow tracking it ran
      # the new code with no diff to review. `.github/dependabot.yml` moves this pin.
      #
      # `persist-credentials: false`: nothing in this workflow uses the token, and by default
      # checkout writes a credential into `.git/config` that stays for every later step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain components
        run: rustup component add rustfmt

      # The gate's clippy is the Makefile's pinned release, not the runner's stable, whose new
      # lints would turn this job red with no commit. Read as digits and dots only and handed
      # to the shell through the environment, for the reason the msrv job gives.
      - name: Read the clippy pin from the Makefile
        id: clippy_pin
        run: echo "v=$(sed -n 's/^CLIPPY_TOOLCHAIN := \([0-9][0-9.]*\)$/\1/p' Makefile)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install "$CLIPPY_PIN" --profile minimal --component clippy
        env:
          CLIPPY_PIN: ${{ steps.clippy_pin.outputs.v }}

      # Built from crates.io rather than fetched by a third-party action, which would put an
      # executable this project did not write into the path of the gate. The build adds no
      # source beyond those the job already uses: GitHub, crates.io, the runner's package
      # archive and rustup's toolchain distribution. `--locked` uses cargo-deny's own committed
      # lockfile, so the build is a function of the version resolved here and not of the day
      # it runs.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      # The Rust half of `make check` is reproducible from the commit: the pinned toolchain
      # against committed lockfiles, `deny` with a committed policy, and no advisory database.
      # `make test` runs the route corpus under gcc and clang and fails where either is missing
      # (`ROUTE_DRIVERS`), so the job installs clang. The shell and YAML linters come from the
      # runner's package archive, so their verdict moves with the runner's image, not with the
      # commit alone.
      - name: Install clang and the shell and YAML lint tools
        run: sudo apt-get update && sudo apt-get install -y clang shellcheck shfmt yamllint

      - name: Install rumdl
        run: cargo install rumdl --locked --version 0.3.4

      # `make check` refuses to run where the hooks are not installed. Nothing in this job
      # commits or pushes, so the hooks never run here; this sets the path and no more.
      - name: make hooks
        run: make hooks

      - name: make check
        run: make check

  # `cargo audit` is not here: it reads a live advisory database, so on a pull request it
  # would turn a branch red for a reason the diff cannot explain. audit.yml runs it weekly.

  # `make msrv`: the declared MSRV built and tested in full, since `rust-version` is a promise
  # to every downstream resolver. `make msrv-compile` is the quick form: it checks the library
  # and every test at the floor without code generation.
  msrv:
    name: build at the declared MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The floor's exact release (x.y.z), as `make msrv` asks rustup for it: rustup reads a
      # two-part `rust-version` as a channel of its own, apart from the release.
      - name: Read the floor from the manifest
        id: floor
        run: echo "v=$(make -s msrv-toolchain)" >> "$GITHUB_OUTPUT"
      # The version reaches the shell through the environment, never through `${{ }}`
      # expansion into the script. On `pull_request` the checkout is the PR's tree, so a fork
      # controls `Cargo.toml`, and an expanded `rust-version` would be spliced in as shell
      # source. As `$MSRV` it is a string that fails to resolve as a toolchain.
      - run: rustup toolchain install "$MSRV" --profile minimal
        env:
          MSRV: ${{ steps.floor.outputs.v }}
      # `make msrv` reads the floor itself, digits and dots only, and quotes it in the
      # recipe, so the value is never shell source there either.
      - run: make msrv

  # The Kani harnesses in `proofs/`: the bounded-read and alignment arguments the ELF reader
  # rests on. `make check` does not run the checker; this job does. It runs
  # `scripts/kani-gate.sh` rather than `make kani`, so no edit of the Makefile reaches this run.
  kani:
    name: model-check the ELF reader's proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install Kani
        run: cargo install --locked kani-verifier --version 0.67.0 && cargo kani setup
      - name: run the kani gate
        run: scripts/kani-gate.sh

  # `make compiler-arms`: the inert-flag rows only clang has, run under clang. `make check`
  # drives the runner's `cc`, which is gcc, so there every such row is announced and none is
  # run; this target points `cc` at clang and fails unless every row naming clang ran. Its own
  # job, so a red mark here names this gate and no other.
  #
  # The gate needs clang 20 or later (the Makefile's `compiler-arms` comment names the floor
  # and its measurement) and this release's `clang` package is 18, so the job installs
  # `clang-20` and puts its directory first on PATH.
  compiler-arms:
    name: inert-flag rows clang owns, under clang 20
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang-20 libclang-rt-20-dev
      - run: echo /usr/lib/llvm-20/bin >> "$GITHUB_PATH"
      - name: make compiler-arms
        run: make compiler-arms

  # `make cross-check`: the crate compiled for macOS (x86_64, aarch64) and FreeBSD (x86_64).
  # Every other job runs on Linux, so code only those systems compile can break their builds
  # with every job green. `cargo check` links nothing, so the runner needs only each target's
  # standard library. The list here is the Makefile's CROSS_TARGETS; a target the Makefile
  # names and this line does not install fails the job rather than being skipped. OpenBSD's
  # target is tier 3 and rustup ships no library for it; the Makefile says how a nightly
  # builds one.
  cross-check:
    name: compile for macOS (x86_64, aarch64) and FreeBSD (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-freebsd
      - name: make cross-check
        run: make cross-check

  # chard is Linux and ELF only and ships a static musl build for images without a
  # matching libc. Building it here keeps the README's `make musl` line honest.
  musl:
    name: static musl build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - run: rustup target add x86_64-unknown-linux-musl
      - run: make musl

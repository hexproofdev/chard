strict = true          # default mode flags only deprecated code points; strict adds zero-width, bidi overrides (Trojan Source), soft hyphens, BOMs
allow = ["U+FE0F"]     # the emoji variation selector (as in a warning sign); the only one found, 59 of 59. Spell it U+XXXX: under rumdl 0.3.4, "FE0F" or "\\uFE0F" silently allow everything
severity = "error"

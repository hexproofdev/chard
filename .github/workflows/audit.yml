# SPDX-License-Identifier: BSD-3-Clause
#
# The advisory lane, on a schedule rather than in the gate.
#
# `cargo audit` reads a live database, so its verdict is a function of the day it runs, not of
# the commit: news about the ecosystem, not about the change under review, so it gates no
# pull request and `make check` stays reproducible from the commit.

---
name: audit

on:
  schedule:
    # Weekly: a graph of four direct dependencies moves slowly.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Queue rather than cancel, unlike ci.yml: an audit run's subject is the advisory database on
# the day it runs, so a later run does not supersede it.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  audit:
    name: advisory database
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Pinned and credential-free for the reasons given in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # From crates.io, not a third-party action, for the reason ci.yml gives for cargo-deny.
      - run: cargo install cargo-audit --locked
      - run: cargo audit
